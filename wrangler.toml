name = "fishshops-dashboard"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"

# The dashboard UI (HTML/JS/CSS). Requests that don't match a file fall
# through to the Worker, which serves /api/*.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fishshops"
# Replace with the id printed by `npx wrangler d1 create fishshops`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "db/migrations"

[vars]
AUTH_MODE = "access"
# Your Zero Trust team domain, e.g. "fishshop.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = ""
# Application Audience (AUD) tag from Zero Trust > Access > Applications > your app.
ACCESS_AUD = ""
# Comma-separated emails that are always admins (so you can't lock yourself out).
BOOTSTRAP_ADMINS = ""

[observability]
enabled = true
