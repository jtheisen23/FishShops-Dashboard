name: Toast sync

on:
  schedule:
    - cron: '15 */2 * * *'  # every 2 hours: refresh yesterday + today
    - cron: '40 11 * * *'   # daily ~4:40am Pacific: re-sync the last 7 days to pick up late edits, tip adjustments and payroll fixes
  workflow_dispatch:
    inputs:
      start:
        description: 'Backfill start date (YYYY-MM-DD). Leave empty for the last 2 days.'
        required: false
      end:
        description: 'Backfill end date (YYYY-MM-DD). Defaults to today.'
        required: false
      locations:
        description: 'Comma-separated location ids (e.g. PL,PB). Empty = all.'
        required: false

concurrency:
  group: toast-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The ETL has no npm dependencies, so there is nothing to install.
      - name: Sync Toast data into D1
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_API_HOST: ${{ vars.TOAST_API_HOST }}
          LOCATIONS_JSON: ${{ secrets.LOCATIONS_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          OVERTIME_MULTIPLIER: ${{ vars.OVERTIME_MULTIPLIER }}
          # Inputs are passed through env (not interpolated into the script) to avoid shell injection.
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_LOCATIONS: ${{ inputs.locations }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [ -n "$IN_START" ]; then
            args+=(--start "$IN_START")
            [ -n "$IN_END" ] && args+=(--end "$IN_END")
          elif [ "$SCHEDULE" = "40 11 * * *" ]; then
            args+=(--days 7)
          else
            args+=(--days 2)
          fi
          [ -n "$IN_LOCATIONS" ] && args+=(--locations "$IN_LOCATIONS")
          node etl/src/index.js "${args[@]}"
